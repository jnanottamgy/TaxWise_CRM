<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>WhatsApp (test fixture)</title>
  <style>
    body { margin: 0; font: 14px system-ui, sans-serif; }
    .two { display: flex; height: 100vh; }
    #side { width: 40%; border-right: 1px solid #ddd; }
    #main { flex: 1; }
    [role="row"] { padding: 8px; cursor: pointer; }
  </style>
</head>
<body>
  <!-- A stand-in for WhatsApp Web, served only to end-to-end tests. It mirrors the structure that
       src/whatsapp/selectors.ts expects. Never shown in a real build. -->
  <div id="app">
    <div class="two">
      <div id="side">
        <header data-tab="2"></header>
        <div class="search">
          <div id="search" contenteditable="true" role="textbox" data-tab="3" aria-label="Search input textbox"></div>
        </div>
        <button aria-label="Archived">Archived</button>
        <div id="pane-side" aria-label="Chat list" role="grid"></div>
      </div>
      <div class="intro" id="intro">Keep your phone connected</div>
    </div>
  </div>
  <script>
    (function () {
      var CHATS = ["TW · TW-C-0142 · XYZ Traders", "TW · TW-C-0201 · Patel Builders", "TW · TW-C-0177 · Sharma Exports"];
      var list = document.getElementById("pane-side");
      var search = document.getElementById("search");

      function openChat(title) {
        var old = document.getElementById("main");
        if (old) old.remove();
        var main = document.createElement("div");
        main.id = "main";
        var header = document.createElement("header");
        var button = document.createElement("div");
        button.setAttribute("role", "button");
        var span = document.createElement("span");
        span.setAttribute("dir", "auto");
        span.setAttribute("title", title);
        span.textContent = title;
        button.appendChild(span);
        header.appendChild(button);
        main.appendChild(header);
        var footer = document.createElement("footer");
        var composer = document.createElement("div");
        composer.setAttribute("contenteditable", "true");
        composer.setAttribute("role", "textbox");
        composer.setAttribute("data-tab", "10");
        footer.appendChild(composer);
        main.appendChild(footer);
        document.querySelector(".two").appendChild(main);
      }

      function render(filter) {
        list.textContent = "";
        CHATS.filter(function (t) { return !filter || t.indexOf(filter) !== -1; }).forEach(function (t) {
          var row = document.createElement("div");
          row.setAttribute("role", "row");
          var inner = document.createElement("div");
          inner.setAttribute("tabindex", "-1");
          var name = document.createElement("span");
          name.setAttribute("dir", "auto");
          name.setAttribute("title", t);
          name.textContent = t;
          inner.appendChild(name);
          row.appendChild(inner);
          row.addEventListener("mousedown", function () { openChat(t); });
          list.appendChild(row);
        });
      }

      search.addEventListener("input", function () { setTimeout(function () { render(search.textContent.trim()); }, 50); });
      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape") { var m = document.getElementById("main"); if (m) m.remove(); }
      });

      render("");
      var params = new URLSearchParams(location.search);
      if (location.pathname === "/send" && params.get("phone")) openChat("+" + params.get("phone"));

      // Test hooks (main world only; the app's preload never calls these).
      window.__fixture = { openChat: openChat };
    })();
  </script>
</body>
</html>
