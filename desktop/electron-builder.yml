# TaxWise Desktop packaging (§7.25.3). Build with `npm run dist:win` / `npm run dist:mac`.
# Secrets (code-signing certificates, Apple credentials) come from CI environment variables,
# never from this repository (§17). See README.md.

appId: in.taxwise.desktop
productName: TaxWise Desktop
copyright: Copyright © 2026 TaxWise Consultants

directories:
  output: release
  buildResources: build

files:
  - package.json
  - dist/main/**
  - dist/preload/**
  - dist/renderer/**

asar: true

# Flip Electron's fuses before signing (scripts/fuses.ts, bundled by scripts/build.mjs).
afterPack: ./dist-build/fuses.cjs

win:
  target:
    - target: nsis
      arch: [x64]
  # Signing: set WIN_CSC_LINK / WIN_CSC_KEY_PASSWORD (or an Azure Trusted Signing config) in CI.
  # Unsigned installers trigger SmartScreen warnings; buy a certificate before rolling out to every PC.
  verifyUpdateCodeSignature: true

nsis:
  oneClick: false
  perMachine: true
  allowElevation: true
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: TaxWise Desktop
  deleteAppDataOnUninstall: false
  artifactName: TaxWise-Desktop-Setup-${version}.${ext}

mac:
  target:
    - target: dmg
      arch: [universal]
  category: public.app-category.business
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Notarisation uses APPLE_API_KEY / APPLE_API_KEY_ID / APPLE_API_ISSUER (or APPLE_ID,
  # APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID) from the CI environment.
  notarize: true
  extendInfo:
    NSMicrophoneUsageDescription: TaxWise Desktop uses the microphone only when you record a WhatsApp voice note.

dmg:
  artifactName: TaxWise-Desktop-${version}.${ext}

# Auto-update feed (electron-updater). A static URL by default; for GitHub Releases instead, run
#   electron-builder --config.publish.provider=github --config.publish.owner=<owner> --config.publish.repo=<repo>
publish:
  provider: generic
  url: ${env.TAXWISE_UPDATE_URL}
  channel: latest
