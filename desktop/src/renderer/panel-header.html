<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
    />
    <meta name="color-scheme" content="light dark" />
    <title>WhatsApp panel</title>
    <link rel="stylesheet" href="./panel-header.css" />
    <script src="./panel-header.js" defer></script>
  </head>
  <body>
    <div id="column" class="column">
      <div
        id="splitter"
        class="splitter"
        role="separator"
        aria-orientation="vertical"
        aria-label="Resize the WhatsApp panel"
        aria-controls="column"
        tabindex="0"
        title="Drag, or use the arrow keys, to resize. Double-click to reset."
      ></div>

      <div class="panel">
        <header class="bar">
          <div class="number" id="number-slot"></div>
          <span id="chip" class="chip" role="status" aria-atomic="true" hidden>
            <span class="dot" aria-hidden="true"></span>
            <span class="chip-label" id="chip-label"></span>
          </span>
          <span class="spacer"></span>
          <button id="pop" class="icon-btn" type="button"></button>
          <button id="close" class="icon-btn" type="button" aria-label="Close the WhatsApp panel" title="Close (Ctrl+Shift+W)"></button>
        </header>

        <section id="banner" class="banner" hidden></section>

        <main id="screen" class="screen" hidden></main>
      </div>
    </div>
  </body>
</html>
